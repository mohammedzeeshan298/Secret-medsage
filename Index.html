<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Message 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 500px;
    background: white;
    padding: 40px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.envelope {
    font-size: 70px;
    animation: float 2s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

h1 {
    color: #333;
}

.subtitle {
    color: #777;
    font-size: 18px;
    margin-bottom: 30px;
}

button {
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    background: #ff4b6e;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

#message {
    display: none;
    margin-top: 30px;
    animation: reveal 1s ease;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#message h2 {
    color: #ff4b6e;
}

#message p {
    font-size: 20px;
    line-height: 1.6;
    color: #444;
}

.heart {
    position: fixed;
    bottom: -20px;
    font-size: 25px;
    animation: rise 5s linear forwards;
}

@keyframes rise {
    from {
        transform: translateY(0);
        opacity: 1;
    }

    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="envelope">💌</div>

    <h1>You Have a Secret Message</h1>

    <p class="subtitle">
        Someone left something special for you...
    </p>

    <button onclick="revealMessage()">
        ✨ Reveal Message ✨
    </button>

    <div id="message">

        <h2>❤️ Surprise!</h2>

        <p>
            You are an amazing person.
            I just wanted to remind you
            that you are special and appreciated.
        </p>

        <p>
            Have a beautiful day! 🌸
        </p>

    </div>

</div>

<script>

function revealMessage() {

    document.getElementById("message").style.display = "block";

    createHearts();

}

function createHearts() {

    for (let i = 0; i < 20; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(function() {
            heart.remove();
        }, 6000);

    }

}

</script>

</body>
</html>
